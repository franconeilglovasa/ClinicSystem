<div class="space-y-4">
  <div class="flex items-center justify-between">
    <a routerLink="/app/queue" class="text-blue-600 hover:underline text-sm">← Queue</a>
    <h2 class="font-semibold text-gray-800">Record Vitals — {{ visitId }}</h2>
  </div>

  <div class="card">
    <form [formGroup]="vitalsForm" (ngSubmit)="save()" class="space-y-4">
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div>
          <label class="form-label">Blood Pressure (mmHg)</label>
          <input type="text" formControlName="bloodPressure" class="form-input" placeholder="120/80">
        </div>
        <div>
          <label class="form-label">Heart Rate (bpm)</label>
          <input type="number" formControlName="heartRate" class="form-input" placeholder="72">
        </div>
        <div>
          <label class="form-label">Temperature (°C)</label>
          <input type="number" step="0.1" formControlName="temperature" class="form-input" placeholder="36.5">
        </div>
        <div>
          <label class="form-label">Weight (kg)</label>
          <input type="number" step="0.1" formControlName="weight" class="form-input" placeholder="70">
        </div>
        <div>
          <label class="form-label">Height (cm)</label>
          <input type="number" step="0.1" formControlName="height" class="form-input" placeholder="170">
        </div>
        <div>
          <label class="form-label">BMI (calculated)</label>
          <input type="text" [value]="computedBmi | number:'1.1-1'" class="form-input bg-gray-50" readonly>
        </div>
        <div>
          <label class="form-label">Oxygen Saturation (%)</label>
          <input type="number" formControlName="oxygenSaturation" class="form-input" placeholder="98">
        </div>
        <div>
          <label class="form-label">Respiratory Rate (breaths/min)</label>
          <input type="number" formControlName="respiratoryRate" class="form-input" placeholder="16">
        </div>
      </div>
      <div>
        <label class="form-label">Notes</label>
        <textarea formControlName="notes" rows="2" class="form-input"></textarea>
      </div>
      <div *ngIf="error" class="text-red-600 text-sm">{{ error }}</div>
      <div class="flex gap-3">
        <button type="submit" [disabled]="saving" class="btn-primary">{{ saving ? 'Saving...' : 'Save Vitals' }}</button>
        <a routerLink="/app/queue" class="btn-secondary">Cancel</a>
      </div>
      <p *ngIf="saved" class="text-green-600 text-sm">✓ Vitals saved successfully!</p>
    </form>
  </div>
</div>
