<div class="min-h-screen bg-blue-800 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-800 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4">C</div>
      <h1 class="text-2xl font-bold text-gray-900">ClinicSystem</h1>
      <p class="text-gray-500 mt-1">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-900">
        <p class="font-semibold mb-1">Default Admin Credentials</p>
        <p>Username: {{ seededAdmin.username }}</p>
        <p>Password: {{ seededAdmin.password }}</p>
        <button type="button" (click)="useDefaultAdmin()" class="mt-2 text-xs font-medium text-blue-700 hover:text-blue-900 underline">
          Use these credentials
        </button>
      </div>

      <div>
        <label class="form-label">Email Address</label>
        <input type="email" formControlName="email" class="form-input" placeholder="you@clinicsystem.com">
      </div>
      <div>
        <label class="form-label">Password</label>
        <input type="password" formControlName="password" class="form-input" placeholder="••••••••">
      </div>

      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 text-sm">
        {{ error }}
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary w-full justify-center flex">
        <span *ngIf="loading">Signing in...</span>
        <span *ngIf="!loading">Sign In</span>
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">ClinicSystem Medical Center — Secure Access</p>
  </div>
</div>
